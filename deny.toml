# Checked against the complete locked dependency graph, including sqlite/tests.
[advisories]
version = 2
unmaintained = "all"
yanked = "deny"
# chrono is marked unmaintained (no vulnerability). It is part of the public API
# (`WebhookEvent::timestamp`, `WebhookVerifier::verify_at`), so replacing it is a
# breaking change for the next major version.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; public API type, replaced in the next major version" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = ["MIT", "Apache-2.0", "ISC", "BSD-3-Clause", "Zlib", "Unicode-3.0", "CDLA-Permissive-2.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
