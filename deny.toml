# Checked against the complete locked dependency graph, including sqlite/tests.
[advisories]
version = 2
unmaintained = "all"
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.8
allow = ["MIT", "Apache-2.0", "ISC", "BSD-3-Clause", "Zlib", "Unicode-3.0", "CDLA-Permissive-2.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
